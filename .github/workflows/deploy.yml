name: Deploy PokéRogue

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout official PokéRogue source
        uses: actions/checkout@v4
        with:
          repository: pagefaultgames/pokerogue
          ref: beta
          path: pokerogue
          submodules: recursive
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pokerogue/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configure GitHub Pages base path
        working-directory: pokerogue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          s = s.replace('base: "",', 'base: "/shspokerogue/",')
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: pokerogue
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: pokerogue
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pokerogue/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
